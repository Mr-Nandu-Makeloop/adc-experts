name: Deploy to S3 and CloudFront

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          VITE_STRIPE_MEMBERSHIP_URL: ${{ secrets.VITE_STRIPE_MEMBERSHIP_URL || 'https://buy.stripe.com/test_adc_membership_a10_week' }}
        run: npm run build

      - name: Determine AWS Region
        id: set-region
        run: |
          REGION="${{ secrets.AWS_REGION }}"
          if [ -z "$REGION" ]; then
            REGION="us-east-1"
          fi
          echo "region=$REGION" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ steps.set-region.outputs.region }}

      - name: Sync build files to S3 bucket
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          if [ -z "$S3_BUCKET_NAME" ]; then
            echo "::error::S3_BUCKET_NAME secret is not set in GitHub repository secrets!"
            exit 1
          fi
          echo "Syncing dist/ to s3://$S3_BUCKET_NAME..."
          aws s3 sync dist/ s3://$S3_BUCKET_NAME --delete

      - name: Invalidate CloudFront cache
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -n "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
            echo "Invalidating CloudFront distribution $CLOUDFRONT_DISTRIBUTION_ID..."
            aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
          else
            echo "CLOUDFRONT_DISTRIBUTION_ID secret not set, skipping invalidation."
          fi
